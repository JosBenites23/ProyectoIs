<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión - La Hacienda</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background-color: #fcf8f3;
      font-family: Arial, sans-serif;
    }

    .form-container {
      max-width: 400px;
      margin: 80px auto;
      padding: 30px;
      background-color: #fff9f1;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .form-container h2 {
      text-align: center;
      color: #4e342e;
      margin-bottom: 20px;
    }

    .form-container input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .form-container button {
      width: 100%;
      padding: 12px;
      background-color: #6d4c41;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .form-container button:hover {
      background-color: #5d4037;
    }

    .login-message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      background-color: #dff0d8;
      color: #3c763d;
    }

    .error {
      background-color: #f8d7da;
      color: #721c24;
    }

    .back-link {
      display: block;
      margin-top: 15px;
      text-align: center;
      color: #6d4c41;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="form-container">
    <h2>Iniciar Sesión</h2>
    <form id="login-form">
      <input type="email" name="email" placeholder="Correo electrónico" required>
      <input type="password" name="password" placeholder="Contraseña" required>
      <button type="submit">Iniciar Sesión</button>
    </form>
    <div id="login-message" class="login-message"></div>
    <a href="index.html" class="back-link">← Volver al inicio</a>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();

      const formData = new FormData(this);

      fetch('login.php', {
        method: 'POST',
        body: formData
      })
      .then(res => res.text())
      .then(data => {
        const msg = document.getElementById('login-message');
        msg.textContent = data;
        msg.style.display = 'block';
        msg.className = 'login-message ' + (data.toLowerCase().includes('exito') ? 'success' : 'error');

        if (data.toLowerCase().includes('exito')) {
        window.location.href = "dashboard.php";
        }
      })
      .catch(err => {
        const msg = document.getElementById('login-message');
        msg.textContent = 'Error en el servidor.';
        msg.style.display = 'block';
        msg.className = 'login-message error';
      });
    });
  </script>

</body>
</html>
