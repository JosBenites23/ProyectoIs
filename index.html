<script>
  const track = document.getElementById('carouselTrack');
  const images = document.querySelectorAll('.carousel-img');
  const imgWidth = 200 + 15; // ancho + margen
  let position = 0;

  function autoSlide() {
    const visibleCount = Math.floor(track.parentElement.offsetWidth / imgWidth);
    const maxPosition = images.length - visibleCount;

    position++;

    if (position > maxPosition) {
      position = 0; // vuelve al inicio
    }

    track.style.transform = `translateX(-${position * imgWidth}px)`;
  }

  // Ejecutar cada 3 segundos
  setInterval(autoSlide, 3000);
</script>
